name: Klang Android CI

on:
  push:
    branches:
      - player/looper-based-rebuild
      - project/klang-liquid-glass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          cache: true

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify Android toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter_version="$(flutter --version --machine | python3 -c 'import json, sys; print(json.load(sys.stdin)["frameworkVersion"])')"
          echo "Flutter version: $flutter_version"
          test "$flutter_version" = "3.50.1"

          gradle_version="$(gradle --version | awk '/^Gradle / { print $2; exit }')"
          echo "Provisioned Gradle version: $gradle_version"
          test "$gradle_version" = "9.5.0"

          grep -Fq 'gradle-9.5.0-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'id("com.android.application") version "9.3.1" apply false' android/settings.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.android") version "2.4.20" apply false' android/settings.gradle.kts
          grep -Fq 'minSdk = 26' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 37' android/app/build.gradle.kts
          grep -Fq 'compileSdk = 37' android/app/build.gradle.kts
          grep -Fq 'val sdkVersion = 37' android/build.gradle.kts
          grep -Fq 'android.builtInKotlin=false' android/gradle.properties
          grep -Fq 'android.newDsl=false' android/gradle.properties

      - name: Resolve Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          plugin_file="$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" -path '*/appambit_sdk_flutter-*/android/src/main/kotlin/*/AppambitSdkFlutterPlugin.kt' -print -quit)"
          if [ -n "$plugin_file" ]; then
            mv -v "$plugin_file" "$(dirname "$plugin_file")/AppAmbitSdkFlutterPlugin.kt"
          fi
          flutter pub get

      - name: Regenerate source and ensure pinned Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          dart run build_runner build

          # The imported Android project had wrapper properties but was missing
          # the wrapper scripts and JAR. Bootstrap the official wrapper using
          # the Gradle version provisioned above, without evaluating the app.
          if [ ! -x android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            wrapper_tmp="$(mktemp -d)"
            trap 'rm -rf "$wrapper_tmp"' EXIT
            printf "rootProject.name = 'gradle-wrapper-bootstrap'\n" > "$wrapper_tmp/settings.gradle"
            : > "$wrapper_tmp/build.gradle"
            (
              cd "$wrapper_tmp"
              gradle wrapper --gradle-version 9.5.0 --distribution-type bin
            )
            install -m 755 "$wrapper_tmp/gradlew" android/gradlew
            install -m 644 "$wrapper_tmp/gradlew.bat" android/gradlew.bat
            install -m 644 "$wrapper_tmp/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x android/gradlew
          wrapper_sha256="$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{ print $1 }')"
          echo "Gradle Wrapper JAR SHA-256: $wrapper_sha256"
          test "$wrapper_sha256" = "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7"

          wrapper_gradle_version="$(cd android && ./gradlew --no-daemon --version | awk '/^Gradle / { print $2; exit }')"
          echo "Wrapper Gradle version: $wrapper_gradle_version"
          test "$wrapper_gradle_version" = "9.5.0"

          find . -type f -name '*.g.dart' -print0 | xargs -0 -r git add --
          git add -- android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(codegen): refresh generated sources and Gradle wrapper [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Dart and Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build universal release APK
        run: flutter build apk --flavor github --release --no-pub

      - name: Build per-architecture release APKs
        run: flutter build apk --flavor github --release --split-per-abi --no-pub

      - name: Verify Android minimum SDK and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          out="build/app/outputs/flutter-apk"
          universal="$out/app-github-release.apk"
          arm32="$out/app-github-armeabi-v7a-release.apk"
          arm64="$out/app-github-arm64-v8a-release.apk"
          x64="$out/app-github-x86_64-release.apk"

          for apk in "$universal" "$arm32" "$arm64" "$x64"; do
            test -f "$apk"
          done

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          analyzer="$(find "$sdk_root" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)"
          test -n "$analyzer"

          verify_min_sdk() {
            actual="$("$analyzer" manifest min-sdk "$1")"
            echo "$1 minimum SDK: $actual"
            test "$actual" = "26"
          }

          verify_lib() {
            apk="$1"
            abi="$2"
            unzip -Z1 "$apk" | grep -Fqx "lib/$abi/libmpv.so"
          }

          for apk in "$universal" "$arm32" "$arm64" "$x64"; do
            verify_min_sdk "$apk"
          done

          verify_lib "$universal" "armeabi-v7a"
          verify_lib "$universal" "arm64-v8a"
          verify_lib "$universal" "x86_64"
          verify_lib "$arm32" "armeabi-v7a"
          verify_lib "$arm64" "arm64-v8a"
          verify_lib "$x64" "x86_64"

          echo "Release APK sizes:"
          ls -lh "$universal" "$arm32" "$arm64" "$x64"

      - name: Upload universal and architecture APKs
        uses: actions/upload-artifact@v4
        with:
          name: Klang-Android-release-APKs
          path: build/app/outputs/flutter-apk/app-github*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android 8.0 (API 26) runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            booted=""
            attempt=0
            while [ "$attempt" -lt 180 ]; do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              [ "$booted" = "1" ] && break
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "$booted" = "1" ]
            adb install -r ./build/app/outputs/flutter-apk/app-github-release.apk
            adb logcat -c
            adb shell am start -n dev.klangretro.player/com.looper.player.MainActivity
            attempt=0
            app_pid=""
            while [ "$attempt" -lt 30 ]; do
              app_pid="$(adb shell pidof dev.klangretro.player 2>/dev/null | tr -d '\r')"
              [ -n "$app_pid" ] && break
              attempt=$((attempt + 1))
              sleep 1
            done
            [ -n "$app_pid" ]
            sleep 8
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|Fatal signal'; then
              echo "API 26 smoke test detected a fatal app or native-library error."
              exit 1
            fi
            echo "API 26 launched Klang successfully (pid $app_pid)."

      - name: Android 17 (API 37) runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            booted=""
            attempt=0
            while [ "$attempt" -lt 180 ]; do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              [ "$booted" = "1" ] && break
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "$booted" = "1" ]
            adb install -r ./build/app/outputs/flutter-apk/app-github-release.apk
            adb logcat -c
            adb shell am start -n dev.klangretro.player/com.looper.player.MainActivity
            attempt=0
            app_pid=""
            while [ "$attempt" -lt 30 ]; do
              app_pid="$(adb shell pidof dev.klangretro.player 2>/dev/null | tr -d '\r')"
              [ -n "$app_pid" ] && break
              attempt=$((attempt + 1))
              sleep 1
            done
            [ -n "$app_pid" ]
            sleep 8
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|NoClassDefFoundError|Fatal signal'; then
              echo "API 37 smoke test detected a fatal app or native-library error."
              exit 1
            fi
            echo "API 37 launched Klang successfully (pid $app_pid)."
